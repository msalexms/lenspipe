<!doctype html>
<html lang="en" data-tema="claro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LensPipe · Camera formats</title>
    <link rel="stylesheet" href="../src/diag.css" />
  </head>
  <body>
    <main>
      <span class="kicker">LensPipe · diagnostics</span>
      <h1>Camera formats</h1>
      <p>Tests which capture sizes and frame rates this browser gives on each lens, then sends the results to the PC. Keep this page open; it takes about a minute.</p>
      <button id="run" class="primary-button" type="button">Run test</button>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="scroll">
        <table id="results" hidden>
          <thead><tr><th>Lens</th><th>Asked</th><th>Got</th><th>FPS</th><th>Max caps</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
    <video id="probe" autoplay muted playsinline aria-hidden="true"></video>
    <script type="module" src="../src/diag/main.ts"></script>
  </body>
</html>
