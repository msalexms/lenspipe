<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" />
    <title>Camera Link · Camera formats</title>
    <link rel="stylesheet" href="/src/shared.css" />
    <style>
      body { padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); }
      main { max-width: 720px; margin: 0 auto; }
      h1 { font-size: 1.3rem; margin: 6px 0 8px; }
      p { color: var(--tinta2); font-size: .9rem; }
      #run { width: 100%; margin: 18px 0 10px; min-height: 44px; }
      #status { font-size: .8rem; color: var(--gris); min-height: 1.5em; }
      table { width: 100%; margin-top: 14px; border-collapse: collapse; font-size: .74rem; font-variant-numeric: tabular-nums; }
      th, td { padding: 5px 6px; border-bottom: 1px solid var(--linea2); text-align: left; white-space: nowrap; }
      th { font-weight: 600; color: var(--gris); text-transform: uppercase; letter-spacing: .04em; font-size: .66rem; }
      td.ok { color: var(--bien); }
      td.no { color: var(--gris); }
      .scroll { overflow-x: auto; }
      video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <main>
      <span class="kicker">Camera link · diagnostics</span>
      <h1>Camera formats</h1>
      <p>Tests which capture sizes and frame rates Safari gives on each lens, then sends the results to the PC. Keep this page open; it takes about a minute.</p>
      <button id="run" class="primary-button" type="button">Run test</button>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="scroll">
        <table id="results" hidden>
          <thead><tr><th>Lens</th><th>Asked</th><th>Got</th><th>FPS</th><th>Max caps</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
    <video id="probe" autoplay muted playsinline></video>
    <script type="module" src="/src/diag/main.ts"></script>
  </body>
</html>
