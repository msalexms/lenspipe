<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LensPipe · Starting…</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #FFF6E9;
        color: #1E1B2E;
        font: 700 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 28px 34px;
        background: #FFFFFF;
        border: 2.5px solid #1E1B2E;
        border-radius: 6px;
        box-shadow: 5px 5px 0 #1E1B2E;
        text-align: center;
      }
      .sticker {
        filter: drop-shadow(3px 3px 0 #1E1B2E);
      }
      .title {
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: -.02em;
      }
      .sub {
        color: #5A5670;
        font-size: .88rem;
        font-weight: 600;
      }
      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 6px;
        border-radius: 50%;
        border: 2px solid #1E1B2E;
        background: #FF5C39;
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse { 50% { opacity: .4; } }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="sticker" width="84" height="78" viewBox="-10 -8 92 86" aria-hidden="true">

        <rect x="7" y="25" width="58" height="39" rx="10" fill="#7CC4FF" stroke="#1E1B2E" stroke-width="3.2" stroke-linejoin="round"/>
        <rect x="13" y="31" width="11" height="5" rx="2.5" fill="#FFE27A" stroke="#1E1B2E" stroke-width="2.2"/>
        <circle cx="56" cy="34" r="3.6" fill="#FF5C39" stroke="#1E1B2E" stroke-width="2.2"/>

</html>
