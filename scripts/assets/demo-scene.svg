<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Demo "camera" picture for the README screenshots (npm run screenshots): a desk in a sunny room. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4E6D2"/>
      <stop offset="1" stop-color="#E8D1B3"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FCBFF"/>
      <stop offset="0.65" stop-color="#CFE8FF"/>
      <stop offset="1" stop-color="#FFE7C2"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C98F5B"/>
      <stop offset="1" stop-color="#A9713F"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF4D6" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FFF4D6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx=".5" cy="0" r="1">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2A1A0A" stop-opacity=".35"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#wall)"/>

  <!-- window -->
  <rect x="150" y="110" width="620" height="520" rx="10" fill="#FFFFFF"/>
  <rect x="172" y="132" width="576" height="476" fill="url(#sky)"/>
  <circle cx="610" cy="260" r="58" fill="#FFF2B8"/>
  <g fill="#FFFFFF" opacity=".9">
    <ellipse cx="300" cy="230" rx="80" ry="26"/><ellipse cx="350" cy="214" rx="56" ry="30"/>
    <ellipse cx="520" cy="360" rx="70" ry="20"/><ellipse cx="560" cy="348" rx="44" ry="22"/>
  </g>
  <path d="M172 520 Q300 430 430 500 T748 470 V608 H172z" fill="#7FB98A"/>
  <path d="M172 560 Q340 500 520 560 T748 540 V608 H172z" fill="#5E9E6E"/>
  <rect x="452" y="132" width="16" height="476" fill="#FFFFFF"/>
  <rect x="172" y="362" width="576" height="16" fill="#FFFFFF"/>
  <rect x="130" y="618" width="660" height="28" rx="6" fill="#FFFFFF"/>
  <!-- sunlight on the wall -->
  <path d="M770 140 L1320 420 L1320 780 L770 640z" fill="url(#sun)"/>

  <!-- shelf with books and a plant -->
  <rect x="1180" y="330" width="560" height="22" rx="4" fill="#8A5A32"/>
  <g>
    <rect x="1220" y="200" width="44" height="130" rx="4" fill="#2B36D9"/>
    <rect x="1270" y="220" width="36" height="110" rx="4" fill="#FFE27A"/>
    <rect x="1312" y="190" width="50" height="140" rx="4" fill="#FF5C39"/>
    <rect x="1368" y="214" width="34" height="116" rx="4" fill="#7CC4FF"/>
    <rect x="1410" y="236" width="120" height="30" rx="4" fill="#1E1B2E" transform="rotate(-18 1470 300)"/>
  </g>
  <path d="M1600 330 h90 l-12 -70 h-66z" fill="#FF8A65"/>
  <g fill="#3F8F5A">
    <path d="M1645 262 C1600 200 1590 160 1620 120 C1640 180 1650 220 1645 262z"/>
    <path d="M1645 262 C1690 210 1720 190 1745 150 C1720 220 1690 250 1645 262z"/>
    <path d="M1645 262 C1660 190 1680 150 1670 100 C1640 160 1640 210 1645 262z"/>
  </g>

  <!-- framed picture -->
  <rect x="900" y="150" width="200" height="150" rx="6" fill="#FFFFFF"/>
  <rect x="914" y="164" width="172" height="122" fill="#7CC4FF"/>
  <circle cx="1040" cy="200" r="18" fill="#FFE27A"/>
  <path d="M914 286 L970 220 L1010 260 L1040 236 L1086 286z" fill="#2B36D9"/>

  <!-- desk -->
  <rect x="0" y="780" width="1920" height="300" fill="url(#desk)"/>
  <rect x="0" y="770" width="1920" height="22" fill="#D9A06A"/>

  <!-- lamp -->
  <path d="M1480 780 h160 l-20 -26 h-120z" fill="#1E1B2E"/>
  <rect x="1550" y="520" width="16" height="240" rx="8" fill="#1E1B2E"/>
  <path d="M1558 530 L1430 440" stroke="#1E1B2E" stroke-width="16" stroke-linecap="round"/>
  <path d="M1350 470 L1450 380 L1500 450 L1420 520z" fill="#2B36D9"/>
  <path d="M1385 495 L1180 790 L1640 790 L1460 500z" fill="url(#lampGlow)"/>

  <!-- notebook -->
  <path d="M640 800 L980 780 L1010 860 L660 885z" fill="#FFFFFF"/>
  <path d="M650 812 L985 792 L992 806 L656 828z" fill="#FFE27A"/>

  <!-- mug with steam -->
  <rect x="1090" y="660" width="120" height="140" rx="16" fill="#FF5C39"/>
  <path d="M1210 690 q50 0 50 40 t-50 40" fill="none" stroke="#FF5C39" stroke-width="18"/>
  <rect x="1090" y="660" width="120" height="22" rx="10" fill="#E8492A"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity=".7">
    <path d="M1130 640 q-18 -30 0 -60 t0 -60"/>
    <path d="M1170 640 q-18 -30 0 -60 t0 -60"/>
  </g>

  <!-- plant pot -->
  <path d="M260 800 h170 l-20 -130 h-130z" fill="#FFFFFF"/>
  <rect x="270" y="660" width="150" height="24" rx="6" fill="#F0E4D4"/>
  <g fill="#4FA36A">
    <path d="M345 665 C270 600 230 520 250 440 C300 520 340 580 345 665z"/>
    <path d="M345 665 C420 590 470 540 520 470 C480 570 420 630 345 665z"/>
    <path d="M345 665 C350 560 380 480 360 390 C320 470 320 570 345 665z"/>
    <path d="M345 665 C300 620 230 600 180 610 C240 650 290 670 345 665z"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
