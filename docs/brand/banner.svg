<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 264" width="920" height="264" role="img" aria-label="LensPipe — An AMSTech project. Turn your iPhone or Android into a low-latency PC &amp; OBS studio camera over USB or Wi-Fi.">
  <!-- Hard ink shadow -->
  <rect x="10" y="10" width="906" height="250" rx="8" fill="#1E1B2E"/>
  <!-- Cream card background -->
  <rect x="4" y="4" width="906" height="250" rx="8" fill="#FFF6E9"/>
  <!-- White header bar -->
  <path d="M12 4H902A8 8 0 0 1 910 12V54H4V12A8 8 0 0 1 12 4Z" fill="#FFFFFF"/>
  <line x1="4" y1="54" x2="910" y2="54" stroke="#1E1B2E" stroke-width="2.5"/>
  <!-- Card ink border -->
  <rect x="4" y="4" width="906" height="250" rx="8" fill="none" stroke="#1E1B2E" stroke-width="2.5"/>

  <!-- Top bar: Thor logo & wordmark -->
  <g transform="translate(22 14) scale(0.62)">
    <path d="M10 4L21 14h6L38 4l5 14q1 2 1 6v12q0 8-8 8H12q-8 0-8-8V24q0-4 1-6z" fill="#2B36D9" stroke="#1E1B2E" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M13 25l6 5-6 5M24 36h10" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="62" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" letter-spacing="-0.3">
    <tspan font-weight="800" fill="#1E1B2E">lenspipe</tspan>
    <tspan dx="8" font-weight="400" fill="#D5CAB5">|</tspan>
    <tspan dx="8" font-weight="700" font-size="16" fill="#5A5670">amstech</tspan>
  </text>

  <!-- Top bar: status & license pills -->
  <rect x="672" y="15" width="130" height="28" rx="6" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="2"/>
  <circle cx="690" cy="29" r="4.5" fill="#6FD08C" stroke="#1E1B2E" stroke-width="1.6"/>
  <text x="702" y="33.5" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#1E1B2E">LOCAL ONLY</text>

  <rect x="812" y="15" width="78" height="28" rx="6" fill="#FFE27A" stroke="#1E1B2E" stroke-width="2"/>
  <text x="851" y="33.5" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="0.6" fill="#1E1B2E">GPL-3.0</text>

  <!-- Hero copy -->
  <text x="28" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.4" fill="#2B36D9">AN AMSTECH PROJECT · OPEN SOURCE</text>
  <text x="28" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8" fill="#1E1B2E">Your phone, your studio camera.</text>
  <text x="28" y="159" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="500" fill="#5A5670">iPhone &amp; Android to PC and OBS over USB or Wi-Fi · WebCodecs + binary WebSockets · No app, no cloud.</text>

  <!-- Thor cámara die-cut sticker (pure SVG hard shadow) -->
  <g transform="translate(778 68) scale(1.34)">
    <g transform="translate(3 3)" fill="#1E1B2E" stroke="#1E1B2E" stroke-width="11" stroke-linejoin="round">
      <path d="M16 5l11 10h18L56 5l5 15v16H11V20z"/>
      <rect x="7" y="25" width="58" height="39" rx="10"/>
      <rect x="4" y="42" width="8" height="12" rx="4"/>
      <rect x="60" y="42" width="8" height="12" rx="4"/>
    </g>
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="11" stroke-linejoin="round">
      <path d="M16 5l11 10h18L56 5l5 15v16H11V20z"/>
      <rect x="7" y="25" width="58" height="39" rx="10"/>
      <rect x="4" y="42" width="8" height="12" rx="4"/>
      <rect x="60" y="42" width="8" height="12" rx="4"/>
    </g>
    <path d="M16 5l11 10h18L56 5l5 15v13H11V20z" fill="#2B36D9" stroke="#1E1B2E" stroke-width="3.2" stroke-linejoin="round"/>
    <circle cx="24" cy="21" r="2.6" fill="#FFFFFF"/>
    <circle cx="48" cy="21" r="2.6" fill="#FFFFFF"/>
    <rect x="7" y="25" width="58" height="39" rx="10" fill="#7CC4FF" stroke="#1E1B2E" stroke-width="3.2"/>
    <rect x="13" y="31" width="11" height="5" rx="2.5" fill="#FFE27A" stroke="#1E1B2E" stroke-width="2.2"/>
    <circle cx="56" cy="34" r="3.6" fill="#FF5C39" stroke="#1E1B2E" stroke-width="2.2"/>
    <circle cx="36" cy="45" r="13.5" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="3.2"/>
    <circle cx="36" cy="45" r="7.5" fill="#1E1B2E"/>
    <circle cx="33" cy="42" r="2.4" fill="#FFFFFF"/>
    <rect x="4" y="42" width="8" height="12" rx="4" fill="#2B36D9" stroke="#1E1B2E" stroke-width="2.8"/>
    <rect x="60" y="42" width="8" height="12" rx="4" fill="#2B36D9" stroke="#1E1B2E" stroke-width="2.8"/>
  </g>

  <!-- Bottom 4-cell cajetín -->
  <rect x="24" y="186" width="866" height="54" rx="6" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="2"/>
  <line x1="240.5" y1="187" x2="240.5" y2="239" stroke="#E9DFCB" stroke-width="1.5"/>
  <line x1="457" y1="187" x2="457" y2="239" stroke="#E9DFCB" stroke-width="1.5"/>
  <line x1="673.5" y1="187" x2="673.5" y2="239" stroke="#E9DFCB" stroke-width="1.5"/>

  <text x="40" y="205" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#5A5670">DEVICES</text>
  <text x="40" y="227" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="800" fill="#1E1B2E">iPhone &amp; Android</text>

  <text x="257" y="205" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#5A5670">TRANSPORT</text>
  <text x="257" y="227" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="800" fill="#1E1B2E">USB · Wi-Fi / LAN</text>

  <text x="473" y="205" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#5A5670">VIDEO</text>
  <text x="473" y="227" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="800" fill="#1E1B2E">4K60 · H.264 / HEVC</text>

  <text x="690" y="205" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="0.9" fill="#5A5670">AUDIO</text>
  <text x="690" y="227" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="800" fill="#1E1B2E">48 kHz 16-bit PCM</text>
</svg>
